<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>神獸養成 · 個人頁</title>
  <link rel="stylesheet" href="pet.css?v=127" />
  <script
    type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"
  ></script>
</head>
<body>
  <a href="index.html" class="back-dashboard">← 返回全班總覽</a>

  <div
    id="teacher-trigger"
    class="teacher-trigger"
    aria-hidden="true"
    title=""
  ></div>

  <main class="app">
    <section class="stage" aria-label="神獸舞台">
      <div class="stage__inner">
        <div id="stage-wrap" class="stage__viewer-wrap">
          <span id="stage-badge" class="stage__badge">載入中…</span>
          <model-viewer
            id="beast-viewer"
            src=""
            alt="神獸 3D 模型"
            autoplay
            camera-controls
            animation-name="idle"
            shadow-intensity="1"
            exposure="1"
            environment-image="neutral"
          ></model-viewer>
        </div>
        <p id="stage-status" class="stage__status" aria-live="polite"></p>
        <p class="stage__hint">拖曳旋轉 · 滾輪縮放</p>
      </div>
    </section>

    <aside class="panel" aria-label="活動紀錄">
      <header class="panel__header">
        <h1 id="pet-student-title" class="panel__title">神獸養成</h1>
        <p id="panel-subtitle" class="panel__subtitle">最近 30 日活動紀錄</p>
      </header>

      <div class="panel__score-summary">
        <span class="panel__score-label">目前分數</span>
        <span id="energy-score" class="panel__score-value">0</span>
      </div>

      <div class="activity-log" aria-label="加減分與生命紀錄">
        <ul id="activity-log-list" class="activity-log__list"></ul>
        <p id="activity-log-empty" class="activity-log__empty" hidden>
          最近 30 日尚無紀錄。
        </p>
      </div>

      <!-- 保留隱藏節點，相容既有 pet.js 邏輯（飼養操作已不顯示於右側） -->
      <div class="panel__legacy-hidden" hidden aria-hidden="true">
        <div id="bar-lang"></div>
        <div id="bar-hunger"></div>
        <div id="bar-energy"></div>
        <div id="bar-knowledge"></div>
        <span id="hunger-value">100</span>
        <span id="energy-value">100</span>
        <span id="knowledge-value">0</span>
        <button type="button" id="btn-study"></button>
        <button type="button" id="btn-feed"></button>
        <button type="button" id="btn-train"></button>
        <button type="button" id="btn-sleep"></button>
        <button type="button" id="btn-teacher"></button>
      </div>
    </aside>
  </main>

  <div
    id="evo-overlay"
    class="evo-overlay"
    style="display: none"
    role="presentation"
  >
    <div
      class="evo-card"
      role="dialog"
      aria-modal="true"
      aria-labelledby="evo-title"
    >
      <div class="evo-sparkles" aria-hidden="true"></div>
      <h2 id="evo-title" class="evo-title">恭喜進化！</h2>
      <p class="evo-text">
        你的語文能量或知識值達成階段里程碑！神獸進化為「學霸神獸」，獲得永久黃金光輝！
      </p>
      <button type="button" id="btn-evo-close" class="btn btn--primary">
        好耶！
      </button>
    </div>
  </div>

  <div id="hatch-overlay" class="hatch-overlay" style="display: none">
    <div class="hatch-card">
      <p class="hatch-card__emoji">🥚✨</p>
      <h2>破殼孵化！</h2>
      <p>語文能量已足夠，神獸誕生了！</p>
    </div>
  </div>

  <div id="quiz-overlay" class="quiz-overlay" style="display: none">
    <div class="quiz-card" role="dialog" aria-modal="true" aria-labelledby="quiz-title">
      <p class="quiz-card__tag">📝 語文小測驗</p>
      <h2 id="quiz-title" class="quiz-card__question"></h2>
      <div id="quiz-options" class="quiz-card__options"></div>
      <button type="button" id="btn-quiz-close" class="btn btn--outline quiz-card__close">
        稍後再說
      </button>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="firebase-config.js"></script>
  <script src="firebase-init.js"></script>
  <script src="pet.js?v=127"></script>
</body>
</html>
